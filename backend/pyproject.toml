[project]
name = "voice-care-platform"
version = "0.1.0"
description = "Multi-tenant AI customer care voice agent platform (Sarvam AI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "cryptography>=43",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "structlog>=24.4",
    "email-validator>=2.2",
    "tzdata>=2026.6",
    "sarvam-conv-ai-sdk>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
package = false
